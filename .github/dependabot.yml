version: 2

# Weekly update pull requests. Nothing here needs a secret. Updates are grouped so there is one pull request per area,
# not one per package. Every pull request still has to pass CI (and a human review) before it is merged.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"        # the website in site/ (pnpm lockfile)
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      site-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
