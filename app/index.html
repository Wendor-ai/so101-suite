<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SO-101 Digital Twin</title>
<style>

*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100vh}

.hud{position:absolute;pointer-events:none;font-variant-numeric:tabular-nums}
.title{left:20px;top:16px}.title h1{margin:0;font-size:19px;letter-spacing:.04em}.title h1 b{color:var(--org)}

@keyframes p{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tools{pointer-events:auto;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;background:#0b1018cc;backdrop-filter:blur(8px);border:1px solid var(--line);padding:8px;border-radius:14px}
.tools button{background:transparent;color:var(--fg);border:1px solid var(--line);padding:7px 12px;font-weight:600;border-radius:9px}.tools button.on{background:var(--org);color:#1a0d00;border-color:var(--org)}
.tag3d{position:absolute;transform:translate(-50%,-100%);padding:5px 10px;border-radius:99px;background:#0b1018d9;border:1px solid var(--org);color:var(--fg);font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none}
.tag3d i{font-style:normal;color:var(--org);margin-right:6px}
#loading{left:50%;top:50%;transform:translate(-50%,-50%);color:var(--mut);font-size:13px;letter-spacing:.08em}
aside{overflow:hidden;padding:12px;border-left:1px solid var(--line);background:#0a0e14;display:flex;flex-direction:column;gap:10px;min-height:0}

button{background:var(--acc);color:#04130c;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:13px}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}button.sm{padding:7px 10px;font-size:12px}button:disabled{opacity:1!important;background:transparent!important;color:var(--mut)!important;border:1px dashed var(--line)!important;cursor:not-allowed!important;font-weight:600}
#askbar{position:fixed;left:0;right:0;bottom:18px;z-index:90;display:none;justify-content:center;padding:0 12px}#askbar.on{display:flex}
.askbox{max-width:560px;background:var(--card);border:2px solid var(--org);border-radius:14px;padding:14px 16px;box-shadow:0 10px 40px #000a;font-size:14px;line-height:1.45}.askbtn{display:flex;gap:10px;margin-top:10px}
.whyoff{font-size:11.5px;color:var(--mut);line-height:1.5;margin:2px 2px 6px}.whyoff b{color:var(--fg);font-weight:600}

.st b{display:block;font-size:12px;color:var(--fg);margin-bottom:2px}.st.cur{border-color:var(--acc2);box-shadow:0 0 0 3px #4cc2ff2e}.st.ok{border-color:var(--acc)}.st.ok b{color:var(--acc)}
.hint{padding:11px 13px;border-radius:12px;background:#4cc2ff1a;margin:10px 0;line-height:1.45;font-size:13px}
.err{background:#ff6b6b24;color:var(--bad)}.okmsg{background:#3ddc9724}.empty{color:var(--mut);padding:8px 0}

.tune{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;margin:8px 0;font-size:12px}.tune .b{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.tune small{color:var(--mut)}
button.on{background:var(--org);color:#1a0d00;border-color:var(--org)}

.sp h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em}.sp .g{margin:12px 0 4px;font-size:11px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}

.jl.bad.flip{transform:translate(calc(-100% - 34px),calc(-100% - 34px))}.jl.bad.flip::after{left:100%;transform:rotate(45deg)}
.jl.bad b{color:#fff;display:block}.jl.bad .bm{display:block;font-weight:600;color:#ffd7d7;margin-top:2px}

.prob{border:1px solid var(--bad);background:#ff6b6b17;border-radius:12px;padding:11px 13px;margin:10px 0;font-size:13px;line-height:1.45}
.prob .pt{font-weight:700;color:var(--bad);margin-bottom:3px}.prob .pw{color:var(--fg);margin-bottom:6px}.prob ol{margin:4px 0 6px 18px;padding:0}.prob li{margin:3px 0}.prob .pstep{margin:6px 0}
.j.bad{background:#ff6b6b24;border-radius:6px;box-shadow:-3px 0 0 var(--bad)}
.ck{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px}.ck .row{margin-bottom:6px}.ck .cm{color:var(--mut);font-size:12px;line-height:1.4;margin:2px 0 8px}
.ckr{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.ckr small{display:block;color:var(--mut);font-size:11px}
.ckst{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}.ckst.ok{color:var(--acc);border-color:var(--acc)}.ckst.warn{color:var(--warn);border-color:var(--warn)}.ckst.fail{color:var(--bad);border-color:var(--bad)}.ckst.run{color:var(--org);border-color:var(--org)}
.cki{grid-column:1/-1;color:var(--warn);font-size:12px;margin:-2px 0 2px 2px}.cki.fail{color:var(--bad)}
#wiz{position:fixed;inset:0;z-index:50;background:#05070b;display:none;grid-template-columns:minmax(0,1fr) 350px;gap:18px;padding:16px}

.wizstep b{color:var(--org)}
.dots{display:flex;gap:8px;align-items:center}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}.dots i.on{background:var(--acc);border-color:var(--acc)}
#wiz ul{margin:0;padding-left:18px;color:var(--mut);font-size:13px;line-height:1.6}
.wizx{position:absolute;right:20px;top:18px;z-index:2}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,92vw)}
.toast{pointer-events:auto;padding:11px 16px;border-radius:12px;background:#0b1018f2;border:1px solid var(--line);box-shadow:0 8px 30px #0008;font-size:14px;display:flex;gap:10px;align-items:center;animation:ti .2s}
.toast.err{border-color:var(--bad)}.toast.warn{border-color:var(--warn)}.toast.ok{border-color:var(--acc)}.toast b{font-weight:700}
@keyframes ti{from{opacity:0;transform:translateY(-8px)}}
#banner{position:fixed;left:0;right:0;top:0;z-index:99;background:#ff6b6b;color:#1a0000;text-align:center;font-weight:700;padding:8px;display:none}
.camwrap{position:relative}.camov{position:absolute;inset:0;margin-top:10px;border-radius:12px;background:#05070bdd;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:8px;font-size:14px}
.camov.on{display:flex}.camov small{color:var(--mut);font-size:12px}.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--warn);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.sc{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut);background:#0b1018b3}.sc i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--bad)}.sc.on i{background:var(--acc)}.sc.warn i{background:var(--warn)}
#wizov{position:absolute;inset:0;border-radius:14px;background:#05070bdd;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:18px;text-align:center;padding:20px}#wizov.on{display:flex}
.wizstep.ok{background:#3ddc9724;border-color:var(--acc)}.wizstep.warn{background:#ffb4541f;border-color:var(--warn)}.camcard{flex:none}.camcard .row{margin-bottom:6px}
.tabs{display:flex;gap:6px;flex:none}.tab{flex:1;background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:9px;font-weight:700}.tab.on{background:var(--org);color:#1a0d00;border-color:var(--org)}
.pane{display:none;flex:1;min-height:0;overflow:hidden}.pane.on{display:block}
.pc .pstat{font-size:13px;padding:9px 11px;border-radius:10px;background:#4cc2ff1a;margin:8px 0;line-height:1.35}
.pc .pstat.err{background:#ff6b6b24;color:var(--bad)}.pc .pstat.okmsg{background:#3ddc9724}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.g3 button{padding:9px 4px;font-size:12px}.w{width:100%}
.j{margin:3px 0 !important}
#modal{position:fixed;inset:0;z-index:70;background:#05070bcc;display:none;align-items:center;justify-content:center}#modal.open{display:flex}
.mcard{width:min(470px,92vw);max-height:92vh;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.camrow{display:grid;grid-template-columns:1fr;gap:6px}.camrow.two{grid-template-columns:1fr 1fr}
.camrow img{width:100%;aspect-ratio:4/3;max-height:24vh;object-fit:contain;background:#000;border-radius:10px;display:block}
.camrow .camov{margin-top:0}.camlab{position:absolute;left:8px;top:6px;font-size:11px;color:#fff;background:#0009;padding:1px 7px;border-radius:99px;z-index:1;pointer-events:none}
.tele{pointer-events:auto;display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.tele button{font-weight:700;padding:10px 16px;border-radius:11px;border:1px solid #2fbf71;background:#2fbf71;color:#06210f;cursor:pointer;font-size:13px}
.tele button:disabled{background:#0b1018b3;border-color:var(--line);color:var(--mut);cursor:not-allowed;font-weight:600}
.tele button.run{background:#e5484d;border-color:#e5484d;color:#fff}
.tele span{font-size:12px;color:var(--fg);background:#0b1018b3;padding:4px 10px;border-radius:99px;max-width:340px;line-height:1.3}.tele span.warn{color:#ffb454}.tele span:empty{display:none}
</style></head><body>
<div class="app">
 <div id="stage">
  <div class="hud title"><h1>SO-101 <b>DIGITAL TWIN</b></h1><div>real SO-101 model · driven live by the motors · drag to orbit · scroll to zoom</div></div>
  <div class="hud live" style="flex-direction:column;align-items:flex-start;gap:6px"><div style="display:flex;align-items:center;gap:8px"><span class="pulse" id="pulse"></span><span id="livetxt">searching for arms…</span></div><div class="chips2" id="chips2"></div><div class="tele" id="tele"><button id="bTele" disabled>▶ Start leader → follower</button><span id="teleMsg"></span></div></div>
  <div class="hud" id="loading">LOADING SO-101 MODEL…</div>
  <div class="hud tools" id="tools">
   <button id="bSet">⚙ Settings</button><button id="bOrbit">Auto-orbit</button><button id="bReset">Reset view</button></div>
  <div class="sp" id="sp"></div>
  <div id="tags"></div><div id="jls"></div>
 </div>
 <aside>
  <div class="camcard card" style="margin:0;padding:10px"><div class="row"><span class="mono" style="margin:0"><span class="dot" id="cd"></span>Camera <span id="cmsg"></span></span></div><div class="camrow" id="camrow"><div class="camwrap"><span class="camlab" id="camlab1" style="display:none">Camera 1</span><img id="cam" src="/stream.mjpg" alt="camera 1"><div class="camov" id="camov"></div></div><div class="camwrap" id="cam2wrap" style="display:none"><span class="camlab">Camera 2</span><img id="cam2" alt="camera 2"><div class="camov" id="camov2"></div></div></div></div>
  <div class="tabs"><button class="tab on" id="tab-pp" onclick="setTab('pp')">Pick &amp; Place</button><button class="tab" id="tab-arms" onclick="setTab('arms')">Arms</button></div>
  <div class="pane on" id="pane-pp"><div id="pp"></div></div>
  <div class="pane" id="pane-arms"><div class="chips" id="armsel" style="margin-bottom:8px"></div><div id="arms"><div class="card"><div class="empty">Looking for arms on USB…</div></div></div></div>
 </aside>
</div>
<div id="askbar"></div>
<div id="modal"><div class="mcard"><div class="row" style="margin-bottom:10px"><b id="mtitle"></b><button class="sm ghost" onclick="closeModal()">✕ Close</button></div><div id="mbody"></div></div></div>
<div id="wiz"></div><div id="toasts"></div><div id="banner"></div>
<script src="/vendor/three.min.js"></script><script src="/vendor/OrbitControls.js"></script><script src="/vendor/STLLoader.js"></script><script src="/vendor/Reflector.js"></script>
<script>
const $=id=>document.getElementById(id);
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), rad=d=>d*Math.PI/180;
// Direction conventions (flip a joint here if the twin looks mirrored vs. the real arm).
const SIGN={shoulder_pan:1,shoulder_lift:1,elbow_flex:1,wrist_flex:1,wrist_roll:1};

/* ---------------- scene ---------------- */
const stage=$('stage'), renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.8;stage.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x07090d,.0030);
const camera=new THREE.PerspectiveCamera(38,1,5,700);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.07;controls.maxPolarAngle=Math.PI*.495;controls.minDistance=30;controls.maxDistance=160;
controls.autoRotate=false;controls.autoRotateSpeed=.7;
const HOME={p:new THREE.Vector3(0,66,150),t:new THREE.Vector3(0,16,0)};
function resetView(){camera.position.copy(HOME.p);controls.target.copy(HOME.t)}resetView();

scene.add(new THREE.HemisphereLight(0xe2eeff,0x3a2a18,1.6));
const sun=new THREE.DirectionalLight(0xffffff,1.7);sun.position.set(40,90,50);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:10,far:260});sun.shadow.radius=5;sun.shadow.bias=-.0004;scene.add(sun);
const rim=new THREE.PointLight(0xff8a1f,1.2,260);rim.position.set(-50,14,-40);scene.add(rim);
const fill=new THREE.PointLight(0x4cc2ff,.6,260);fill.position.set(60,20,-50);scene.add(fill);

const sky=new THREE.Mesh(new THREE.SphereGeometry(600,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
 uniforms:{top:{value:new THREE.Color()},hor:{value:new THREE.Color()}},
 vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 top;uniform vec3 hor;varying vec3 p;void main(){float h=clamp(normalize(p).y,0.,1.);gl_FragColor=vec4(mix(hor,top,pow(h,.5)),1.);}'}));scene.add(sky);
const floor=new THREE.Mesh(new THREE.CircleGeometry(400,64),new THREE.MeshStandardMaterial({color:0x1f2a3b,roughness:.85,metalness:.1}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
let grid=null,fine=null,mirror=null,tableY=0;
function setTableY(y){if(Math.abs(y-tableY)<.01)return;tableY=y;floor.position.y=y;if(grid)grid.position.y=y+.25;if(fine)fine.position.y=y+.12;catcher.position.y=y+.06;if(mirror)mirror.position.y=y-.05}
const catcher=new THREE.Mesh(new THREE.CircleGeometry(300,48),new THREE.ShadowMaterial({opacity:.5}));catcher.rotation.x=-Math.PI/2;catcher.position.y=.06;catcher.receiveShadow=true;catcher.visible=false;scene.add(catcher);
function makeGrids(th){[grid,fine].forEach(g=>g&&scene.remove(g));
 grid=new THREE.GridHelper(400,40,th.grid,th.grid);grid.position.y=.25+tableY;grid.material.transparent=true;grid.material.opacity=th.gridA;scene.add(grid);
 fine=new THREE.GridHelper(400,200,th.fine,th.fine);fine.position.y=.12+tableY;fine.material.transparent=true;fine.material.opacity=.5;scene.add(fine)}
const reachRing=()=>{const g=new THREE.Group();
 const r=new THREE.Mesh(new THREE.RingGeometry(37.6,38.2,128),new THREE.MeshBasicMaterial({color:0xff8a1f,transparent:true,opacity:.55,side:THREE.DoubleSide}));
 const f=new THREE.Mesh(new THREE.CircleGeometry(38,96),new THREE.MeshBasicMaterial({color:0xff8a1f,transparent:true,opacity:.05}));
 g.add(r,f);g.rotation.x=-Math.PI/2;g.position.y=.4;return g};

/* ---------------- real SO-101 model (official URDF + STL, Apache-2.0) ---------------- */
const ASSET='/assets/so101/';
const stlLoader=new THREE.STLLoader(), stlCache=new Map();
const loadSTL=f=>{f=f.split('/').pop();if(!stlCache.has(f))stlCache.set(f,new Promise((ok,no)=>stlLoader.load(ASSET+f,ok,undefined,no)));return stlCache.get(f)};
const urdfP=fetch(ASSET+'so101_new_calib.urdf').then(r=>r.text()).then(t=>new DOMParser().parseFromString(t,'text/xml'));

}
let teleOn=false;
function teleUI(t){const b=$('bTele'),m=$('teleMsg');if(!t||!b)return;teleOn=!!t.on;$('tele').style.display=(t.both||t.on)?'flex':'none';
 b.disabled=!t.on&&!!t.why;b.className=t.on?'run':'';b.textContent=t.on?'■ Stop leader → follower':'▶ Start leader → follower';
 const txt=t.on?(t.blocked?t.blocked:`${t.msg}${t.synced&&t.hz?' · '+t.hz+' Hz · '+t.ms+' ms work · worst gap '+t.max_ms+' ms':''}`):(t.why||t.msg||'Move the leader by hand: the follower copies it');

/* ---------------- fast pose feed: joint positions at display rate (the full state is only needed ~10 times a second) ---------------- */
/* The LEADER is drawn in the FOLLOWER's frame (its reading goes through the same leader -> follower map teleop uses), so the same physical pose shows the same angle on both 3D arms.
   Before: each arm used the middle of its OWN swept range as zero, and those middles differ (leader pan 1770 vs follower 2084), so one pose read 39 vs 3 degrees. */
let LMAP=null;
const mapRaw=(n,raw)=>{const p=LMAP&&LMAP[n];if(!p)return raw;if(p.kind==='prop'){let t=Math.min(1,Math.max(0,(raw-p.l[0])/Math.max(1,p.l[1]-p.l[0])));if(p.flip)t=1-t;return p.f[0]+t*(p.f[1]-p.f[0])}return Math.min(p.fhi,Math.max(p.flo,p.sign*raw+p.k))};

let poseT=0,POSEHZ=0,_pn={},_pa={},_pt=performance.now();
function poseDeg(a,pos,n){const deg={...ZERO};
 a.joints.forEach(j=>{const p0=pos[j.name];if(p0==null)return;const [p,r]=viewRaw(a,j,p0),mid=r?(r[0]+r[1])/2:2047.5,d=(p-mid)*360/4095,f=VIZ.flip[j.name]?-1:1,off=VIZ.offset[j.name]||0;
  if(j.name==='gripper'){const pct=(r?clamp((p-r[0])/Math.max(1,r[1]-r[0]),0,1):p/4095)*100;deg.gripper=f<0?100-pct:pct}else deg[j.name]=j.name==='wrist_roll'?rollUnwrap(n,f*d+off):f*d+off});return deg}
async function poseLoop(){
 for(;;){
  try{const r=await (await fetch('/api/pose')).json();
   if(lastS&&lastS.arms)lastS.arms.forEach((a,n)=>{const q=r.arms[a.port];if(q&&q.online&&!a.remote)targets[n]=poseDeg(a,q.pos,n)});
   poseT=performance.now();for(const k in r.arms){_pa[k]=(_pa[k]||0)+(r.arms[k].n-(_pn[k]??r.arms[k].n));_pn[k]=r.arms[k].n}
   const now=performance.now();if(now-_pt>=1000){POSEHZ=Math.round(Math.max(0,...Object.values(_pa))*1000/(now-_pt));for(const k in _pa)_pa[k]=0;_pt=now}
  }catch(e){await new Promise(r=>setTimeout(r,300))}
  await new Promise(r=>setTimeout(r,28));      /* about 30 fetches a second is plenty and keeps the server's Python threads free for the motors */
 }}
poseLoop();
